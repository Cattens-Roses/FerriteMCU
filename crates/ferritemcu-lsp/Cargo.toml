[package]
name = "ferritemcu-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Language Server Protocol transport and document utilities for FerriteMCU"

[lints]
workspace = true

[dependencies]
serde_json.workspace = true
url = "2"
ureq = "3"
flate2 = "1"
sha2 = "0.10"
# 9.x fixes several ZIP extraction advisories in the 2.x line. Rust-analyzer
# release archives use deflate; the rest of zip's optional formats are unnecessary.
zip = { version = "9.0", default-features = false, features = ["deflate-flate2"] }
